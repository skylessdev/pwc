<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsletter — The Platonist Wine Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0a; --muted:#444; --hover:#000; --bg:#ffffff; --line:#ededed;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'EB Garamond', Garamond, 'Times New Roman', serif;
  }
  a{color:var(--muted); text-decoration:none;}
  a:hover{color:var(--hover);}
  ul{margin:0; padding:0; list-style:none;}

  header{max-width:100%; margin:0 auto;}
  header .head-inner{padding-top:45px; padding-bottom:34px; text-align:center;}
  header .logo img{width:220px; display:block; margin:0 auto;}

  main{
    max-width:560px; margin:0 auto;
    padding:0 40px 140px;
    text-align:center;
  }
  main h1{
    font-family:'Cormorant Garamond', serif;
    font-size:18px; letter-spacing:4px; text-transform:uppercase;
    font-weight:600; margin:0 0 20px;
  }
  main p{
    font-size:15px; line-height:1.7; color:var(--muted);
    margin:0 0 30px;
  }
  .newsletter-form{
    display:flex; flex-direction:column; gap:16px;
    max-width:400px; margin:0 auto;
  }
  .newsletter-form input[type="email"]{
    font-family:'EB Garamond', Garamond, 'Times New Roman', serif;
    font-size:15px; padding:12px 16px;
    border:1px solid var(--line); background:#fff;
    color:var(--ink); outline:none;
  }
  .newsletter-form input[type="email"]:focus{border-color:#aaa;}
  .newsletter-form button{
    font-family:'Cormorant Garamond', serif;
    font-size:13px; letter-spacing:4px; text-transform:uppercase;
    padding:12px 24px; border:1px solid var(--ink);
    background:var(--ink); color:#fff; cursor:pointer;
  }
  .newsletter-form button:hover{background:#222;}
  .form-note{
    font-size:12px; color:#aaa; letter-spacing:1px;
    margin-top:20px;
  }
  .fade-message{
    opacity:0;
    transition:opacity .4s ease;
  }
  .fade-message.visible{
    opacity:1;
  }
  .fade-out{
    opacity:0;
    transition:opacity .3s ease;
  }

  footer.bottom-nav{
    max-width:100%; position:fixed; bottom:0; left:0; width:100%; background:#fff;
    border-top:1px solid var(--line);
  }
  footer.bottom-nav nav{width:100%; padding:20px 0;}
  footer.bottom-nav ul{display:table; margin:0 auto; text-align:center;}
  footer.bottom-nav ul li{display:inline-block; padding:0 20px;}
  footer.bottom-nav ul li a{
    color:var(--muted); font-size:12px; line-height:22px;
    text-transform:uppercase; letter-spacing:3px;
  }
  @media screen and (max-width:960px){
    footer.bottom-nav{position:relative;}
    footer.bottom-nav ul{display:block;}
    footer.bottom-nav ul li{display:block; padding:9px 25px; text-align:left; border-top:1px solid var(--line);}
  }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <a class="logo" href="index.html">
      <img src="assets/PWC.png" alt="The Platonist Wine Company">
    </a>
  </div>
</header>

<main>
  <h1>Newsletter</h1>
  <p>Stay informed about new releases, harvest updates, and events from The Platonist Wine Company.</p>

  <form class="newsletter-form" id="newsletterForm">
    <input type="email" name="email" placeholder="Your email address" required aria-label="Email address">
    <button type="submit">Subscribe</button>
  </form>
  <p class="form-note">We respect your privacy. Unsubscribe at any time.</p>
  <div class="fade-message" id="newsletterMessage">You've been added to the list.</div>
</main>

<footer class="bottom-nav">
  <nav>
    <ul>
      <li><a href="grand-old-duke.html">The Grand Old Duke</a></li>
      <li><a href="prelude.html">The Prelude</a></li>
      <li><a href="memento-mori.html">Memento Mori</a></li>
      <li><a href="love-letter.html">A Love Letter</a></li>
      <li><a href="newsletter.html">Newsletter</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>
</footer>
<script>
  (function(){
    var form = document.getElementById('newsletterForm');
    var message = document.getElementById('newsletterMessage');
    var note = document.querySelector('.form-note');

    form.addEventListener('submit', function(event){
      event.preventDefault();

      var email = form.email.value.trim();
      if (!email) return;

      fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      })
      .then(function(response){
        return response.json();
      })
      .then(function(result){
        if (!result.success) {
          note.textContent = result.error || 'Unable to save your email right now.';
          return;
        }

        // Small grey status
        note.textContent = result.duplicate
          ? 'Already subscribed.'
          : 'Submitted successfully.';

        form.classList.add('fade-out');

        setTimeout(function(){
          form.style.display = 'none';

          // Large confirmation message
          message.textContent = result.duplicate
            ? 'You are already on the list.'
            : 'You have been added to the list.';

          message.classList.add('visible');
        }, 300);
      })
      .catch(function(){
        note.textContent = 'Something went wrong. Please try again later.';
      });
    });
  })();
</script>

</body>
</html>
